# DEMO 2: CI entry point. This workflow orchestrates jobs; it runs no build logic itself.
name: Course CI

# Three ways in. pull_request from a fork gets a read-only token and no secrets.
# pull_request_target is deliberately never used: it would run untrusted PR code privileged.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top. Naming any permission sets every unnamed one to none.
permissions:
  contents: read

# Superseded runs for the same PR or branch are cancelled, saving runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # DEMO 3: job-level `uses` calls a reusable workflow instead of inlining steps.
  # A callee may narrow these permissions; it can never widen them beyond the caller.
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-ci.yml
    with:
      artifact-name: course-build

  # DEMO 4: a second job on a separate runner, consuming the reusable workflow's output.
  summary:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      # A separate job does not inherit another job's workspace, so the local action
      # must be checked out before use.
      - name: Check out the local action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keeps the job's token out of the runner's on-disk git config.
          persist-credentials: false
      # `./` means an action from this repository, not a downloaded third-party action.
      - name: Summarize executed tests
        uses: ./.github/actions/course-summary
        with:
          # Measured on another runner and handed over through job outputs.
          test-count: ${{ needs.ci.outputs.test-count }}

  # DEMO 6: safe secret consumption. Three guards must all hold: manual dispatch,
  # the main ref, and a non-fork repository. A PR can never reach this job.
  secret-demo:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the course Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # Scoped to this one step, so no other step sees the value. The script reports
      # only "configured" or "not configured": never the value, length, or a hash.
      - name: Check presence only
        run: node scripts/secret-presence.mjs
        env:
          COURSE_DEMO_FLAG: ${{ secrets.COURSE_DEMO_FLAG }}
