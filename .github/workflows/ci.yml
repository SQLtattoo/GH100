name: Course CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-ci.yml
    with:
      artifact-name: course-build

  summary:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Check out the local action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Summarize executed tests
        uses: ./.github/actions/course-summary
        with:
          test-count: ${{ needs.ci.outputs.test-count }}
