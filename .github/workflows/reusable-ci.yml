name: Reusable CI

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the small course build artifact
        type: string
        default: course-build
        required: false
    outputs:
      test-count:
        description: Number of tests executed successfully
        value: ${{ jobs.build.outputs.test-count }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      test-count: ${{ steps.tests.outputs.test-count }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 22 and npm download cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - name: Test and export the measured count
        id: tests
        run: node scripts/run-ci-tests.mjs
      - run: npm run build
      - name: Upload the course build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            dist/
            artifacts/test-results.tap
          if-no-files-found: error
          retention-days: 3
