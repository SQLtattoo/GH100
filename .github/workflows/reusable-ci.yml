# DEMO 3: a reusable workflow. `workflow_call` turns CI into a callable contract
# with typed inputs and declared outputs, instead of copied-and-pasted steps.
name: Reusable CI

on:
  workflow_call:
    # What the caller may pass in.
    inputs:
      artifact-name:
        description: Name of the small course build artifact
        type: string
        default: course-build
        required: false
    # What the caller gets back: a real measured number, not a hardcoded one.
    outputs:
      test-count:
        description: Number of tests executed successfully
        value: ${{ jobs.build.outputs.test-count }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    # Step output -> job output -> workflow output: the three hops of the contract.
    outputs:
      test-count: ${{ steps.tests.outputs.test-count }}
    steps:
      # Every third-party action is pinned to a full 40-character commit SHA, so a
      # moved or compromised tag cannot silently change what runs. The trailing
      # comment keeps the human-readable release visible; Dependabot updates both.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches downloaded npm packages keyed on the lockfile, not node_modules.
      - name: Set up Node 22 and npm download cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      # `npm ci` installs exactly the lockfile; --ignore-scripts blocks install-time code.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      # `id` is what makes this step's output addressable above.
      - name: Test and export the measured count
        id: tests
        run: node scripts/run-ci-tests.mjs
      - run: npm run build
      # DEMO 5: artifacts persist run output after the job's runner workspace is gone.
      # Uploading one needs no write permission and is not a published package.
      - name: Upload the course build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            dist/
            artifacts/test-results.tap
          if-no-files-found: error
          retention-days: 3
